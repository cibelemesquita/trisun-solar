<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA166" />
      <stop offset="40%" stop-color="#F25A13" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA166" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <!-- Fundo circular escuro para destaque em abas claras e escuras -->
  <circle cx="32" cy="32" r="31" fill="#040F28" />
  <circle cx="32" cy="32" r="30" fill="none" stroke="#F25A13" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Raios Solares -->
  <g stroke="url(#rayGrad)" stroke-width="3.5" stroke-linecap="round">
    <!-- Raios Principais -->
    <line x1="32" y1="7" x2="32" y2="14" />
    <line x1="32" y1="50" x2="32" y2="57" />
    <line x1="7" y1="32" x2="14" y2="32" />
    <line x1="50" y1="32" x2="57" y2="32" />
    
    <!-- Raios Diagonais -->
    <line x1="14.33" y1="14.33" x2="19.28" y2="19.28" />
    <line x1="44.72" y1="44.72" x2="49.67" y2="49.67" />
    <line x1="14.33" y1="49.67" x2="19.28" y2="44.72" />
    <line x1="44.72" y1="19.28" x2="49.67" y2="14.33" />
  </g>

  <!-- Núcleo do Sol -->
  <circle cx="32" cy="32" r="12.5" fill="url(#sunGrad)" />

  <!-- Brilho Interno Suave -->
  <circle cx="28" cy="28" r="4.5" fill="#FFF4D0" opacity="0.75" />
</svg>
